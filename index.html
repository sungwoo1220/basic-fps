<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>Basic FPS Launcher</title><style>*{box-sizing:border-box}body{margin:0;background:#111c2c;color:#eaf1fa;font:16px Arial,'Malgun Gothic';padding:40px}h1{letter-spacing:3px;color:#80e1cd}p{color:#a9bbce;line-height:1.7}input{width:100%;padding:12px;background:#23334b;border:1px solid #4b6380;color:white;font-size:16px;margin:10px 0}input[type=checkbox]{width:auto}button{padding:13px 18px;border:0;border-radius:5px;background:#80e1cd;color:#112a30;font-weight:bold;margin:8px 4px 8px 0;cursor:pointer}button:disabled{opacity:.4;cursor:default}#status{padding:18px;background:#1d2c42;min-height:90px;overflow-wrap:anywhere}small{color:#a9bbce}</style></head><body><h1>BASIC FPS</h1><p>실행할 때 패치를 확인하고 변경된 게임 파일만 받습니다.</p><label><input type="checkbox" id="host" checked> 내 PC에서 서버 실행</label><input id="address" value="http://127.0.0.1:3000" aria-label="서버 주소"><button id="update">업데이트 확인</button><button id="play" disabled>게임 실행</button><p id="status">런처 준비 중…</p><small>친구 서버에 접속하려면 체크를 해제하고 서버 주소를 입력하세요.<br>외부 접속에는 서버 PC 방화벽 및 TCP 3000 포트 설정이 필요합니다.</small><script src="ui.js"></script></body></html>
