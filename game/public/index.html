<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basic FPS v3</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="menu"><section>
<h1>BASIC FPS v3</h1>
<p>수평 FOV 103 · 조준 모드 없음 · 최대 16명</p>
<label>닉네임 <input id="name" maxlength="16" value="Player"></label>
<label>마우스 감도 <input id="sens" type="number" min="0.001" max="10" step="0.001" value="0.350"><span id="sensValue">0.350</span></label>
<label>안티앨리어싱 (MSAA) <select id="aa"><option value="0">끔 — 성능 우선</option><option value="2">2배</option><option value="4">4배 — 기본</option><option value="8">8배 — 가장 부드러움</option></select></label>
<label>연습 봇 <select id="botsCount"><option value="0">없음</option><option value="1">1명</option><option value="3" selected>3명</option><option value="6">6명</option></select></label><button id="botsApply">봇 수 적용 (서버 PC 전용)</button>
<label>FPS 제한 (0 = 제한 없음)<input id="fpsLimit" type="number" min="0" max="1000" step="1" value="0"></label>
<small class="hint">최신 런처에서 0으로 두면 모니터 주사율 제한이 풀려요(수직 동기화 꺼짐).</small>
<button id="play" disabled>연결 중…</button>
<p id="status">서버에 연결하고 있습니다.</p>
<small>WASD 이동 / Shift 걷기 / 마우스 시점 / 왼쪽 클릭 사격 / R 재장전(12발)<br>Esc 메뉴 / Tab 점수판<br>점프와 달리기는 없는 기본 버전입니다.</small>
</section></div>
<div id="crosshair">+</div><div id="hit">×</div><div id="hud">HP 100</div><div id="fps">— FPS</div><div id="feed"></div><div id="board" hidden></div>
<script src="/shared.js"></script>
<script type="module" src="/game.js"></script>
</body>
</html>
