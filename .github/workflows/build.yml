name: Build and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Bundle Three.js
        shell: pwsh
        run: Copy-Item node_modules/three/build/three.module.js game/public/three.module.js
      - run: npm test
      - name: Syntax checks
        shell: bash
        run: |
          node --check game/server.js
          node --input-type=module --check < game/public/game.js
      - name: Build installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          npm run build -- --publish never
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Prepare patch
        shell: pwsh
        run: |
          $env:RELEASE_TAG = "build-${{ github.run_number }}-${{ github.run_attempt }}"
          node publish.cjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" dist/Basic-FPS-Launcher-Setup.exe patch/* --title "Basic FPS build ${{ github.run_number }}" --notes "12-round magazine and reload controls."
