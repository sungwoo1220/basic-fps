name: DX11 Windows trial (no Epic account)
on:
  pull_request:
    paths: ['dx11/**', 'game/**', 'unreal/Source/BasicFPS/Public/**', '.node-version', '.github/workflows/dx11.yml', 'scripts/publish-dx11.cjs', 'scripts/upload-dx11-release.cjs', 'native-update.cjs']
  push:
    branches: [main]
    paths: ['dx11/**', 'game/**', 'unreal/Source/BasicFPS/Public/**', '.node-version', '.github/workflows/dx11.yml', 'scripts/publish-dx11.cjs', 'scripts/upload-dx11-release.cjs', 'native-update.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Build executable and test protocol
        run: |
          node scripts/export-unreal-rules.cjs --check
          cmake -S dx11 -B "$env:RUNNER_TEMP/dx11" -A x64
          cmake --build "$env:RUNNER_TEMP/dx11" --config Release --parallel
          ctest --test-dir "$env:RUNNER_TEMP/dx11" -C Release --output-on-failure
      - name: Assemble a self-contained folder with the room
        run: |
          $runtime=Join-Path $env:RUNNER_TEMP 'dx11-room-deps'
          npm.cmd install --prefix $runtime --no-audit --no-fund --no-save ws@8.18.3 three@0.170.0
          $env:NODE_PATH=Join-Path $runtime 'node_modules'
          node scripts/copy-three.cjs
          Remove-Item Env:NODE_PATH
          $pkg=New-Item -ItemType Directory "$env:RUNNER_TEMP/dx11-package" -Force
          $room=New-Item -ItemType Directory (Join-Path $pkg 'room') -Force
          Copy-Item "$env:RUNNER_TEMP/dx11/Release/BasicFPS-DX11.exe",'dx11/README.md' $pkg
          $node=(Get-Command node).Source
          Copy-Item $node (Join-Path $room 'node.exe')
          $license=Join-Path (Split-Path $node) 'LICENSE'
          if(Test-Path $license) { Copy-Item $license (Join-Path $room 'NODE-LICENSE.txt') }
          Copy-Item game/server.js $room
          Copy-Item game/public (Join-Path $room 'public') -Recurse
          '{"name":"basic-fps-room","private":true,"type":"commonjs","dependencies":{"ws":"8.18.3"}}' | Set-Content (Join-Path $room 'package.json') -Encoding ascii
          npm.cmd install --prefix $room --omit=dev --no-package-lock --no-audit --no-fund
          if(-not (Test-Path (Join-Path $room 'public/three.module.js'))) { throw 'three.module.js missing from the room.' }
      - name: Try the packaged executable, its own room and software graphics
        run: ./dx11/Test-Windows.ps1 -GameExe "$env:RUNNER_TEMP/dx11-package/BasicFPS-DX11.exe" -OutputRoot "$env:RUNNER_TEMP/dx11-evidence"
      - name: Package portable trial
        run: |
          $out=New-Item -ItemType Directory "$env:RUNNER_TEMP/dx11-download" -Force
          Compress-Archive -Path "$env:RUNNER_TEMP/dx11-package/*" -DestinationPath "$out/BasicFPS-DX11-Win64.zip"
          $hash=(Get-FileHash "$out/BasicFPS-DX11-Win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BasicFPS-DX11-Win64.zip" | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
      - name: Pack the files the launcher downloads (same folder as the ZIP)
        env:
          RELEASE_TAG: dx11-test-${{ github.run_number }}-${{ github.run_attempt }}
        run: node scripts/publish-dx11.cjs "$env:RUNNER_TEMP/dx11-package" "$env:RUNNER_TEMP/dx11-chunks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dx11-automated-evidence
          path: ${{ runner.temp }}/dx11-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dx11-portable
          path: |
            ${{ runner.temp }}/dx11-download/
            ${{ runner.temp }}/dx11-chunks/
          if-no-files-found: error
  publish:
    if: github.repository == 'sungwoo1220/basic-fps' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two runs must not prune each other's draft release.
    concurrency:
      group: dx11-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Cone mode always includes the root files (native-update.cjs, .node-version) next to the scripts folder.
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/download-artifact@v4
        with:
          name: dx11-portable
          path: download
      - name: Publish separately from the stable launcher and Unreal updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/upload-dx11-release.cjs download/dx11-download download/dx11-chunks
