name: DX11 Windows trial (no Epic account)
on:
  pull_request:
    paths: ['dx11/**', 'game/**', 'unreal/Source/BasicFPS/Public/**', '.node-version', '.github/workflows/dx11.yml']
  push:
    branches: [main]
    paths: ['dx11/**', 'game/**', 'unreal/Source/BasicFPS/Public/**', '.node-version', '.github/workflows/dx11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Build executable and test protocol
        run: |
          node scripts/export-unreal-rules.cjs --check
          cmake -S dx11 -B "$env:RUNNER_TEMP/dx11" -A x64
          cmake --build "$env:RUNNER_TEMP/dx11" --config Release --parallel
          ctest --test-dir "$env:RUNNER_TEMP/dx11" -C Release --output-on-failure
      - name: Try the actual Windows executable with a private test room and software graphics
        run: |
          $runtime=Join-Path $env:RUNNER_TEMP 'dx11-room-deps'
          npm.cmd install --prefix $runtime --no-audit --no-fund --no-save ws@8.18.3 three@0.170.0
          $env:NODE_PATH=Join-Path $runtime 'node_modules'
          node scripts/copy-three.cjs
          ./dx11/Test-Windows.ps1 -GameExe "$env:RUNNER_TEMP/dx11/Release/BasicFPS-DX11.exe" -OutputRoot "$env:RUNNER_TEMP/dx11-evidence"
      - name: Package portable trial
        run: |
          $out=New-Item -ItemType Directory "$env:RUNNER_TEMP/dx11-download" -Force
          Compress-Archive -Path "$env:RUNNER_TEMP/dx11/Release/BasicFPS-DX11.exe",'dx11/README.md' -DestinationPath "$out/BasicFPS-DX11-Win64.zip"
          $hash=(Get-FileHash "$out/BasicFPS-DX11-Win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BasicFPS-DX11-Win64.zip" | Set-Content "$out/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dx11-automated-evidence
          path: ${{ runner.temp }}/dx11-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: dx11-portable
          path: ${{ runner.temp }}/dx11-download/
          if-no-files-found: error
  publish:
    if: github.repository == 'sungwoo1220/basic-fps' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dx11-portable
          path: download
      - name: Publish separately from the stable launcher and Unreal updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: dx11-test-${{ github.run_number }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" download/BasicFPS-DX11-Win64.zip download/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --prerelease --latest=false --title "Basic FPS DX11 Windows 시험판" \
            --notes "에픽 계정 없이 실행하는 별도 시험판입니다. 기존 런처로 방을 연 뒤 ZIP을 풀고 BasicFPS-DX11.exe에서 방 주소를 입력하세요. Windows 통신과 소프트웨어 DX11 렌더링을 자동 확인했습니다. 노트북 외장 GPU·독점 전체화면·MSAA 성능은 별도 확인이 필요합니다."
